<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>탁구 기록장</title>
<meta name="description" content="탁구 대회·리그·레슨·연습 기록과 피드백을 달력으로 관리합니다.">
<meta name="theme-color" content="#eaeef4" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0e131a" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="탁구 기록장">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" href="./icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="./icon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap">
<style>
/* 레이아웃: 스티키 헤더 + 탭 3개, 본문 단일 컬럼(최대 900px), 상세는 오버레이 — 좁으면 바텀시트, 넓으면 중앙 다이얼로그 */
:root{
  color-scheme:light;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --bg:#eaeef4; --surface:#ffffff; --surface-2:#f3f6fa; --sunk:#e3e8f0;
  --ink:#121821; --muted:#5d6878; --line:#d3dae4;
  --accent:#17457c; --accent-ink:#ffffff;
  --win:#0d7047; --loss:#b23a3a;
  --t-tour:#c2500f; --t-league:#17457c; --t-lesson:#6a3fa0; --t-practice:#0d7047;
  --shadow:0 10px 30px rgba(16,30,54,.14);
  --r:10px;
  --font-ui:"IBM Plex Sans KR",-apple-system,BlinkMacSystemFont,"Segoe UI","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --font-num:"Barlow Condensed","IBM Plex Sans KR",sans-serif;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0e131a; --surface:#161d26; --surface-2:#1c2531; --sunk:#111821;
  --ink:#e7ecf3; --muted:#94a1b1; --line:#28323e;
  --accent:#5c9ddf; --accent-ink:#0b1017;
  --win:#36b07b; --loss:#e27676;
  --t-tour:#e8833f; --t-league:#5c9ddf; --t-lesson:#ab8ce2; --t-practice:#36b07b;
  --shadow:0 10px 30px rgba(0,0,0,.5);
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#0e131a; --surface:#161d26; --surface-2:#1c2531; --sunk:#111821;
  --ink:#e7ecf3; --muted:#94a1b1; --line:#28323e;
  --accent:#5c9ddf; --accent-ink:#0b1017;
  --win:#36b07b; --loss:#e27676;
  --t-tour:#e8833f; --t-league:#5c9ddf; --t-lesson:#ab8ce2; --t-practice:#36b07b;
  --shadow:0 10px 30px rgba(0,0,0,.5);
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0}
img{max-width:100%}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--font-ui);font-size:14px;line-height:1.5;-webkit-text-size-adjust:100%}
h1,h2,h3{margin:0;text-wrap:balance}
button{font-family:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:900px;margin:0 auto;padding-inline:16px;padding-block:0 48px}

/* 헤더 */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:var(--bg);
  border-bottom:1px solid var(--line);margin-inline:-16px;padding-inline:16px;padding-block:14px 0}
.brand{display:flex;align-items:center;gap:9px}
.ball{width:13px;height:13px;border-radius:50%;background:var(--t-tour);flex:0 0 auto;
  box-shadow:inset -2px -2px 0 rgba(0,0,0,.18)}
.brand h1{font-size:1.06rem;font-weight:700;letter-spacing:-.01em}
.hbtn{margin-left:auto;border:1px solid var(--line);background:var(--surface);border-radius:8px;
  padding:5px 10px;font-size:.76rem;cursor:pointer;display:flex;align-items:center;gap:6px}
.hbtn+.hbtn{margin-left:6px}
.hbtn:hover{border-color:var(--accent)}
.dot{width:7px;height:7px;border-radius:50%;background:var(--muted);flex:0 0 auto}
.dot.on{background:var(--win)} .dot.off{background:var(--t-tour)}
.tabs{display:flex;gap:2px;margin-top:12px}
.tabs button{appearance:none;background:none;border:0;border-bottom:2px solid transparent;
  padding:9px 14px;font-size:.9rem;font-weight:500;color:var(--muted);cursor:pointer}
.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent);font-weight:600}

.notice{margin-top:14px;padding:10px 12px;border-radius:var(--r);font-size:.82rem;
  background:color-mix(in srgb,var(--loss) 12%,var(--surface));border:1px solid color-mix(in srgb,var(--loss) 35%,transparent)}

/* 월 네비 */
.monthbar{display:flex;align-items:center;gap:8px;margin:20px 0 12px}
.mlabel{font-family:var(--font-num);font-size:1.6rem;font-weight:600;letter-spacing:.01em;
  display:flex;align-items:baseline;gap:6px;min-width:0}
.mlabel .yr{font-size:.86rem;color:var(--muted);font-weight:500}
.nav{width:34px;height:34px;border-radius:9px;border:1px solid var(--line);background:var(--surface);
  cursor:pointer;font-size:1.05rem;line-height:1;display:grid;place-items:center}
.nav:hover{border-color:var(--accent)}
.ghost{margin-left:auto;border:1px solid var(--line);background:var(--surface);border-radius:9px;
  padding:7px 12px;font-size:.82rem;cursor:pointer}
.ghost:hover{border-color:var(--accent)}

/* 달력 */
.weekhead{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-bottom:5px}
.weekhead span{text-align:center;font-size:.7rem;font-weight:600;color:var(--muted);letter-spacing:.08em}
.weekhead span:first-child{color:var(--loss)} → .weekhead span:nth-child(6){color:var(--accent)}
.weekhead span:last-child{color:var(--accent)} → .weekhead span:last-child{color:var(--loss)}
.grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.cell{position:relative;display:flex;flex-direction:column;gap:4px;align-items:stretch;
  min-height:84px;padding:6px 5px;border:1px solid var(--line);border-radius:9px;
  background:var(--surface);cursor:pointer;text-align:left;font:inherit}
.cell:hover{border-color:var(--accent)}
.cell.out{background:var(--sunk);opacity:.5}
.cell.today{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.dnum{font-family:var(--font-num);font-size:.95rem;font-weight:600;color:var(--muted);line-height:1}
.cell.today .dnum{color:var(--accent)}
.marks{display:flex;flex-direction:column;gap:3px;min-width:0}
.chip{display:flex;align-items:center;gap:4px;min-width:0;font-size:.68rem;line-height:1.3;
  padding:2px 4px;border-radius:4px;background:var(--surface-2);border-left:3px solid var(--c)}
.chip em{font-style:normal;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.chip.planned{background:transparent;border:1px dashed var(--c);border-left:3px solid var(--c);opacity:.85}
.more{font-size:.63rem;color:var(--muted);padding-left:3px;font-family:var(--font-num)}
@media (max-width:640px){
  .grid,.weekhead{gap:3px}
  .cell{min-height:80px;padding:4px 2px}
  .dnum{padding-left:3px;font-size:.85rem}
  .marks{gap:2px}
  .chip{font-size:.62rem;line-height:1.25;padding:2px 3px;border-left-width:2px;align-items:flex-start;
    background:color-mix(in srgb,var(--c) 14%,var(--surface))}
  .chip em{white-space:normal;word-break:break-all;display:-webkit-box;-webkit-line-clamp:2;
    -webkit-box-orient:vertical;overflow:hidden}
}
.legend{display:flex;flex-wrap:wrap;gap:12px;margin-top:14px;font-size:.76rem;color:var(--muted)}
.legend b{display:inline-flex;align-items:center;gap:5px;font-weight:500}
.legend i{width:9px;height:9px;border-radius:50%;background:var(--c);display:inline-block}

/* 카드 공통 */
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px}
.eyebrow{font-size:.7rem;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:600;margin-bottom:10px}

/* 통계 */
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin:20px 0}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:13px 14px}
.tile .k{font-size:.74rem;color:var(--muted);margin-bottom:5px}
.tile .v{font-family:var(--font-num);font-size:1.85rem;font-weight:600;line-height:1;font-variant-numeric:tabular-nums}
.tile .v small{font-size:.9rem;font-weight:500;color:var(--muted);margin-left:4px}
.tile .sub{font-size:.74rem;color:var(--muted);margin-top:5px}
.bars{display:flex;align-items:flex-end;gap:10px;height:148px;margin-top:4px}
.barcol{flex:1;display:flex;flex-direction:column;justify-content:flex-end;gap:5px;min-width:0}
.barstack{display:flex;flex-direction:column-reverse;gap:2px;border-radius:5px;overflow:hidden}
.barseg{min-height:3px}
.barcap{font-family:var(--font-num);font-size:.82rem;text-align:center;color:var(--muted);font-variant-numeric:tabular-nums}
.barlab{font-size:.68rem;text-align:center;color:var(--muted);white-space:nowrap}
.rowlist{display:flex;flex-direction:column}
.rowitem{display:flex;gap:11px;align-items:flex-start;padding:11px 0;border-top:1px solid var(--line);cursor:pointer;text-align:left;background:none;border-left:0;border-right:0;border-bottom:0;font:inherit;width:100%}
.rowitem:first-child{border-top:0}
.rowitem:hover{background:var(--surface-2)}
.rdate{font-family:var(--font-num);font-size:.84rem;color:var(--muted);min-width:46px;padding-top:2px;font-variant-numeric:tabular-nums}
.rbody{min-width:0;flex:1}
.rtitle{font-weight:600;font-size:.92rem;display:flex;align-items:center;gap:7px;flex-wrap:wrap}
.rsum{font-size:.8rem;color:var(--muted);margin-top:3px;word-break:break-word}
.badge{font-size:.67rem;font-weight:600;padding:2px 6px;border-radius:4px;color:#fff;background:var(--c);letter-spacing:.02em}
.badge.out{background:transparent;color:var(--c);border:1px dashed var(--c)}
.tag{font-family:var(--font-num);font-size:.85rem;font-weight:600;font-variant-numeric:tabular-nums}
.tag.w{color:var(--win)} .tag.l{color:var(--loss)}

/* 필터 */
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:18px 0 12px}
.chips button{border:1px solid var(--line);background:var(--surface);border-radius:999px;
  padding:6px 13px;font-size:.81rem;cursor:pointer}
.chips button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}

.empty{text-align:center;padding:44px 18px;color:var(--muted)}
.empty strong{display:block;color:var(--ink);font-size:1rem;margin-bottom:6px}
.empty p{margin:0 0 16px;font-size:.86rem}

/* 오버레이 */
.overlay{position:fixed;inset:0;z-index:50;background:rgba(10,16,24,.5);display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--surface);width:100%;max-width:620px;border-radius:16px 16px 0 0;
  max-height:88vh;overflow-y:auto;box-shadow:var(--shadow);
  padding:18px 16px calc(22px + env(safe-area-inset-bottom,0px))}
@media (min-width:700px){ .overlay{align-items:center} .sheet{border-radius:14px;max-height:86vh;padding:22px} }
.sheethead{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.sheethead h2{font-size:1.05rem;font-weight:700}
.x{margin-left:auto;width:32px;height:32px;border-radius:8px;border:1px solid var(--line);
  background:var(--surface);cursor:pointer;font-size:1rem;line-height:1}

/* 폼 */
.field{margin-bottom:13px}
.field label,.flabel{display:block;font-size:.78rem;font-weight:600;color:var(--muted);margin-bottom:5px}
input[type=text],input[type=date],input[type=number],textarea,select{
  width:100%;padding:9px 11px;border:1px solid var(--line);border-radius:9px;
  background:var(--surface-2);color:var(--ink);font-family:inherit;font-size:.92rem}
textarea{resize:vertical;min-height:72px;line-height:1.55}
textarea.big{min-height:110px}
.seg{display:flex;gap:5px;flex-wrap:wrap}
.seg button{flex:1;min-width:66px;padding:9px 6px;border:1px solid var(--line);background:var(--surface-2);
  border-radius:9px;font-size:.85rem;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:600}
.seg.types button[aria-pressed="true"]{background:var(--c);border-color:var(--c);color:#fff}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.block{border:1px solid var(--line);border-radius:11px;padding:13px;margin-bottom:13px;background:var(--surface-2)}
.block>.flabel{margin-bottom:9px;color:var(--ink);font-size:.84rem}
.scorerow{display:grid;grid-template-columns:1fr auto 1fr;gap:8px;align-items:end}
.scorerow .mid{padding-bottom:10px;color:var(--muted);font-family:var(--font-num);font-size:1.1rem}
.roundrow{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1.4fr) 52px 10px 52px 32px;gap:6px;align-items:center;margin-bottom:7px}
.roundrow input{padding:7px 8px;font-size:.86rem;background:var(--surface)}
.roundrow .vs{text-align:center;color:var(--muted);font-family:var(--font-num)}
.roundrow .del{width:30px;height:30px;border:1px solid var(--line);background:var(--surface);
  border-radius:7px;cursor:pointer;color:var(--muted);line-height:1}
@media (max-width:520px){
  .roundrow{grid-template-columns:minmax(0,1fr) 46px 10px 46px 30px}
  .roundrow .opp{grid-column:1/-1;order:9}
}
.addbtn{border:1px dashed var(--line);background:none;border-radius:9px;padding:8px 12px;
  font-size:.83rem;cursor:pointer;color:var(--muted);width:100%}
.addbtn:hover{border-color:var(--accent);color:var(--accent)}
.actions{display:flex;gap:9px;margin-top:18px}
.primary{flex:1;background:var(--accent);color:var(--accent-ink);border:0;border-radius:10px;
  padding:12px;font-size:.93rem;font-weight:600;cursor:pointer;font-family:inherit}
.danger{border:1px solid color-mix(in srgb,var(--loss) 45%,transparent);background:none;color:var(--loss);
  border-radius:10px;padding:12px 14px;font-size:.88rem;cursor:pointer;font-family:inherit}
.detail dt{font-size:.74rem;color:var(--muted);font-weight:600;margin-bottom:3px}
.detail dd{margin:0 0 12px;font-size:.9rem;white-space:pre-wrap;word-break:break-word}
.rounds-view{display:flex;flex-direction:column;gap:5px;margin:0 0 12px}
.rv{display:flex;align-items:center;gap:9px;font-size:.88rem;padding:6px 9px;border-radius:7px;background:var(--surface-2)}
.rv .rl{font-weight:600;min-width:52px}
.rv .rs{font-family:var(--font-num);font-weight:600;font-size:1rem;font-variant-numeric:tabular-nums}
.rv .ro{color:var(--muted);font-size:.82rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rv .rr{margin-left:auto;font-size:.78rem;font-weight:600}
.typepick{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.typepick button{padding:15px 10px;border:1px solid var(--line);border-left:4px solid var(--c);
  background:var(--surface-2);border-radius:10px;cursor:pointer;text-align:left;font:inherit}
.typepick button:hover{border-color:var(--c)}
.typepick b{display:block;font-size:.95rem;margin-bottom:2px}
.typepick span{font-size:.74rem;color:var(--muted)}
.muted{color:var(--muted);font-size:.84rem}
.hr{height:1px;background:var(--line);margin:16px 0}
.srow{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:10px}
.srow .grow{flex:1;min-width:140px}
@media (prefers-reduced-motion:no-preference){ .sheet{animation:up .18s ease-out} @keyframes up{from{transform:translateY(14px);opacity:.4}} }
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="brand">
      <span class="ball"></span><h1>탁구 기록장</h1>
      <button class="hbtn" id="syncBtn"><span class="dot" id="syncDot"></span><span id="syncLabel">연결 중</span></button>
      <button class="hbtn" id="themeBtn" aria-label="테마 전환">◐</button>
    </div>
    <nav class="tabs" role="tablist">
      <button id="tab-cal" role="tab" aria-selected="true" aria-controls="view-cal">달력</button>
      <button id="tab-stats" role="tab" aria-selected="false" aria-controls="view-stats">통계</button>
      <button id="tab-list" role="tab" aria-selected="false" aria-controls="view-list">기록</button>
    </nav>
  </header>

  <div id="notice" class="notice" hidden></div>

  <section id="view-cal" role="tabpanel">
    <div class="monthbar">
      <button class="nav" id="prevM" aria-label="이전 달">‹</button>
      <button class="nav" id="nextM" aria-label="다음 달">›</button>
      <div class="mlabel"><span class="yr" id="mYear"></span><span id="mMonth"></span></div>
      <button class="ghost" id="todayBtn">오늘</button>
    </div>
    <div class="weekhead"><span>월</span><span>화</span><span>수</span><span>목</span><span>금</span><span>토</span><span>일</span>
    <div class="grid" id="calGrid"></div>
    <div class="legend" id="legend"></div>
  </section>

  <section id="view-stats" role="tabpanel" hidden></section>
  <section id="view-list" role="tabpanel" hidden></section>
</div>

<div class="overlay" id="overlay" hidden><div class="sheet" role="dialog" aria-modal="true" id="sheet"></div></div>
<input type="file" id="importFile" accept="application/json,.json" hidden>

<script type="module" src="./app.js"></script>
</body>
</html>
